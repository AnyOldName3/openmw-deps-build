name: Build

on:
- push
- pull_request

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_REVISION: 84bab45d415d22042bd0b9081aea57f362da3f35

jobs:
  vcpkg-macos:
    strategy:
      fail-fast: true
      matrix:
        stuff:
        - triplet: arm64-osx-dynamic
        - triplet: arm64-osx

    name: vcpkg-${{ matrix.stuff.triplet }}

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - uses: ./.github/actions/vcpkg-setup

    - name: brew stuff
      run: brew install autoconf autoconf-archive automake

    - name: confirm vcpkg install path
      run: command -v vcpkg

    - name: Install vcpkg packages
      run: >
        vcpkg install --overlay-ports=ports --overlay-triplets=triplets --host-triplet ${{ matrix.stuff.triplet }} --triplet ${{ matrix.stuff.triplet }}
        luajit

    - name: get the logz
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ matrix.stuff.triplet }}-logz
        path: /usr/local/share/vcpkg/buildtrees/**/*.log

  upstream-macos:
    strategy:
      fail-fast: true
      matrix:
        stuff:
        - kind: dynamic
        - kind: static
    
    name: upstream-${{ matrix.stuff.kind }}

    runs-on: macos-latest

    steps:
      - name: get source
        run: |
          git clone https://github.com/LuaJIT/LuaJIT
          cd LuaJIT
          git checkout d0e88930ddde28ff662503f9f20facf34f7265aa

      - name: Get GNU make from within the last two decades
        run: brew install make

      - name: build it
        run: |
          cd LuaJIT
          BUILDMODE=${{ matrix.stuff.kind }} MACOSX_DEPLOYMENT_TARGET=15.6 gmake --debug=p
